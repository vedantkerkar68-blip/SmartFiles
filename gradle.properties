# Low-memory tuning. The host has ~7.3 GB RAM with ~5.5 GB headroom; too little
# heap makes in-process D8 dexing GC-thrash and hang, so we use a moderate heap
# and keep parallel workers/daemons capped.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=192m

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 built-in Kotlin + KSP: allow KSP to register its generated source sets
# via the Kotlin DSL (standard workaround for this version pairing).
android.disallowKotlinSourceSets=false
kotlin.code.style=official
